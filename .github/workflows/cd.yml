name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (optional, defaults to latest main)"
        required: false

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NAMESPACE: interview-demo

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, k8s-deployer]
    environment:
      name: prod
      url: http://demo.local:31080
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || 'main' }}
          
      - name: Set lowercase repo name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          
      - name: Set deployment SHA
        id: sha
        run: |
          if [ -n "${{ inputs.sha }}" ]; then
            echo "sha=${{ inputs.sha }}" >> "$GITHUB_OUTPUT"
            echo "Deploying specified SHA: ${{ inputs.sha }}"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "Deploying current SHA: ${{ github.sha }}"
          fi
          
      - name: Setup namespace
        run: |
          kubectl get ns ${{ env.NAMESPACE }} >/dev/null 2>&1 || kubectl create ns ${{ env.NAMESPACE }}
          kubectl config set-context --current --namespace=${{ env.NAMESPACE }}
          
      - name: Validate manifests
        run: kubectl kustomize k8s/overlays/prod >/dev/null
        
      - name: Deploy manifests
        run: kubectl apply -k k8s/overlays/prod
        
      - name: Update images
        run: |
          SHA=${{ steps.sha.outputs.sha }}
          kubectl set image deploy/backend backend=${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}-backend:$SHA
          kubectl set image deploy/frontend frontend=${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}-frontend:$SHA
          
      - name: Wait for rollout
        run: |
          kubectl rollout status deploy/backend --timeout=300s
          kubectl rollout status deploy/frontend --timeout=300s
          
      - name: Health check
        run: |
          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          curl -f -H 'Host: demo.local' "http://${NODE_IP}:31080/"
          curl -f -H 'Host: demo.local' "http://${NODE_IP}:31080/api/hello" | grep -i "hello from backend"
          
      - name: Deployment summary
        run: |
          echo "✅ Successfully deployed ${{ steps.sha.outputs.sha }}"
          kubectl get all -o wide

  notify:
    if: always()
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        uses: rjstone/discord-webhook-notify@v1
        with:
          severity: ${{ needs.deploy.result == 'success' && 'info' || 'error' }}
          details: |
            ${{ needs.deploy.result == 'success' && '🚀 Deployment succeeded' || '🔴 Deployment failed' }}
            Repo: ${{ github.repository }}
            Environment: prod
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
