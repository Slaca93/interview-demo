name: Deploy

on:
  workflow_run:
    workflows: ["CI"]          # a CI workflow neve
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to deploy"
        required: false
        default: "main"

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    # csak sikeres CI után fusson (workflow_run ágon)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [ self-hosted, k8s-deployer ]
    environment:
      name: prod
      url: http://demo.local:31080
    env:
      NS: interview-demo

    steps:
      - name: Checkout manifests
        uses: actions/checkout@v4
        with:
          # workflow_run esetén a main HEAD-re váltunk
          ref: ${{ github.event_name == 'workflow_run' && 'main' || (inputs.ref || 'main') }}
          fetch-depth: 0

      - name: Compute lowercase repo
        id: vars
        run: echo "repo_lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve deploy SHA
        id: rev
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            # dispatch: a megadott ref lehet ág/tag/SHA
            git fetch --all --tags
            SHA="$(git rev-parse '${{ inputs.ref || 'main' }}^{commit}')"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying commit: $SHA"

      - name: Preflight (kubectl/kustomize, namespace)
        shell: bash
        run: |
          set -euo pipefail
          kubectl version --client
          kustomize version
          kubectl get ns "$NS" >/dev/null 2>&1 || kubectl create ns "$NS"
          kubectl config set-context --current --namespace="$NS"
          # render-validáció
          kustomize build k8s/overlays/prod >/dev/null
          # diff (információs)
          kubectl diff -k k8s/overlays/prod || true

      - name: Apply overlays
        run: |
          set -euo pipefail
          kubectl apply -k k8s/overlays/prod

      # ---- ITT a biztonságos 'pin to SHA' logika ----
      - name: Pin images to CI SHA safely
        shell: bash
        env:
          REPO_LOWER: ${{ steps.vars.outputs.repo_lower }}
          SHA: ${{ steps.rev.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          REPO="ghcr.io/${REPO_LOWER}"

          # helper függvények
          have_docker() { command -v docker >/dev/null 2>&1; }
          tag_exists() { docker manifest inspect "$1" >/dev/null 2>&1; }
          setimg()     { kubectl -n "$NS" set image "$1" "$2=$3"; }

          BACKEND_IMG="${REPO}-backend:${SHA}"
          FRONTEND_IMG="${REPO}-frontend:${SHA}"

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "workflow_run: feltételezzük, hogy a CI pusholta a ${SHA} tageket → pin-elünk SHA-ra."
            setimg deploy/backend  backend  "${BACKEND_IMG}"
            setimg deploy/frontend frontend "${FRONTEND_IMG}"
          else
            echo "workflow_dispatch: óvatos pin → csak ha docker elérhető és létezik a tag."
            if have_docker && tag_exists "${BACKEND_IMG}"; then
              setimg deploy/backend  backend  "${BACKEND_IMG}"
            else
              echo "Backend image ${BACKEND_IMG} nem elérhető — marad :latest"
            fi
            if have_docker && tag_exists "${FRONTEND_IMG}"; then
              setimg deploy/frontend frontend "${FRONTEND_IMG}"
            else
              echo "Frontend image ${FRONTEND_IMG} nem elérhető — marad :latest"
            fi
          fi

      - name: Rollout & health (auto-rollback on failure)
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "[!] Rollout failed, dumping debug..."; \
                kubectl -n "$NS" get deploy,rs,pod -o wide || true; \
                kubectl -n "$NS" describe deploy/backend  || true; \
                kubectl -n "$NS" describe deploy/frontend || true; \
                kubectl -n "$NS" logs -l app=backend  --tail=200 || true; \
                kubectl -n "$NS" logs -l app=frontend --tail=200 || true; \
                echo "[!] Rolling back..."; \
                kubectl -n "$NS" rollout undo deploy/backend  || true; \
                kubectl -n "$NS" rollout undo deploy/frontend || true; \
                exit 1' ERR

          # Java warmup miatt nagyobb türelem ajánlott:
          kubectl -n "$NS" rollout status deploy/backend  --timeout=420s
          kubectl -n "$NS" rollout status deploy/frontend --timeout=420s

      - name: Smoke test through Ingress
        shell: bash
        run: |
          set -euo pipefail
          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          curl -fsS -H 'Host: demo.local' "http://${NODE_IP}:31080/" >/dev/null
          curl -fsS -H 'Host: demo.local' "http://${NODE_IP}:31080/api/hello" | tee /tmp/hello.txt
          grep -qi 'Hello from backend' /tmp/hello.txt

      - name: Summary
        run: |
          echo "✅ Deployed commit: ${{ steps.rev.outputs.sha }}"
          kubectl -n "$NS" get deploy,svc,ingress,pod -o wide

  notify:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Discord notify (success)
        if: ${{ success() }}
        uses: rjstone/discord-webhook-notify@v1
        with:
          severity: info
          details: |
            🚀 CD succeeded
            Repo: ${{ github.repository }}
            Env: prod
            Commit: ${{ github.sha }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Discord notify (failure)
        if: ${{ failure() }}
        uses: rjstone/discord-webhook-notify@v1
        with:
          severity: error
          details: |
            🔴 CD failed
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
