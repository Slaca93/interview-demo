name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to deploy (optional). If empty, deploy latest successful CI on main."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    # csak sikeres CI után fusson (workflow_run ágon) VAGY manual dispatch
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: [ self-hosted, k8s-deployer ]
    environment:
      name: prod
      url: http://demo.local:31080
    env:
      NS: interview-demo

    steps:
      - name: Checkout manifests
        uses: actions/checkout@v4
        with:
          # workflow_run: a main HEAD-re váltunk
          ref: ${{ github.event_name == 'workflow_run' && 'main' || (inputs.ref && inputs.ref || 'main') }}
          fetch-depth: 0

      - name: Compute lowercase repo
        id: vars
        run: echo "repo_lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # --- ÚJ: SHA feloldása ---
      - name: Resolve deploy SHA
        id: rev
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # legutóbbi SIKERES CI run head_sha-ja
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            # workflow_dispatch
            if [ -n "${{ inputs.ref }}" ]; then
              # ha kézzel adtak meg ref-et, azt használjuk (commit-ra oldjuk)
              SHA="$(git rev-parse '${{ inputs.ref }}^{commit}')"
            else
              # ha nem adtak ref-et: kérd le a legutóbbi SIKERES CI run-t a main-en (REST API)
              # 1) Lekérjük az összes completed futást, majd az első success-t kivesszük
              RUNS_JSON=$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/CI.yml/runs?branch=main&status=success&per_page=1")
              SHA=$(echo "$RUNS_JSON" | jq -r '.workflow_runs[0].head_sha')
              if [ -z "${SHA:-}" ] || [ "${SHA}" = "null" ]; then
                echo "No successful CI run found on main."
                exit 1
              fi
            fi
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying commit: $SHA"

      - name: Preflight (kubectl/kustomize, namespace)
        shell: bash
        run: |
          set -euo pipefail
          kubectl version --client
          kustomize version
          kubectl get ns "$NS" >/dev/null 2>&1 || kubectl create ns "$NS"
          kubectl config set-context --current --namespace="$NS"
          # render-validáció
          kustomize build k8s/overlays/prod >/dev/null
          # diff (információs)
          kubectl diff -k k8s/overlays/prod || true

      # --- ÚJ: image-ek létezésének ellenőrzése ---
      - name: Preflight: images exist in GHCR
        shell: bash
        env:
          REPO: ghcr.io/${{ steps.vars.outputs.repo_lower }}
          SHA:  ${{ steps.rev.outputs.sha }}
        run: |
          set -euo pipefail
          for comp in backend frontend; do
            IMAGE="$REPO-$comp:$SHA"
            if ! docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
              echo "❌ Missing image: $IMAGE"
              echo "Tip: ellenőrizd, hogy a CI futás valóban feltolta-e a képet erre a SHA-ra."
              exit 1
            fi
            echo "✅ Found image: $IMAGE"
          done

      - name: Apply overlays
        run: |
          set -euo pipefail
          kubectl apply -k k8s/overlays/prod

      # --- MÓDOSÍTOTT: pinelés a feloldott SHA-ra ---
      - name: Pin images to resolved SHA
        shell: bash
        env:
          REPO: ghcr.io/${{ steps.vars.outputs.repo_lower }}
          SHA:  ${{ steps.rev.outputs.sha }}
          NS:   ${{ env.NS }}
        run: |
          set -euo pipefail
          kubectl -n "$NS" set image deploy/backend  backend="$REPO-backend:$SHA"
          kubectl -n "$NS" set image deploy/frontend frontend="$REPO-frontend:$SHA"

      - name: Rollout & health (auto-rollback on failure)
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "[!] Rollout failed, rollback..."; \
                kubectl -n "$NS" rollout undo deploy/backend  || true; \
                kubectl -n "$NS" rollout undo deploy/frontend || true; \
                exit 1' ERR

          kubectl -n "$NS" rollout status deploy/backend  --timeout=180s
          kubectl -n "$NS" rollout status deploy/frontend --timeout=180s

      - name: Smoke test through Ingress
        shell: bash
        run: |
          set -euo pipefail
          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          curl -fsS -H 'Host: demo.local' "http://${NODE_IP}:31080/" >/dev/null
          curl -fsS -H 'Host: demo.local' "http://${NODE_IP}:31080/api/hello" | tee /tmp/hello.txt
          grep -qi 'Hello from backend' /tmp/hello.txt

      - name: Summary
        run: |
          echo "✅ Deployed commit: ${{ steps.rev.outputs.sha }}"
          kubectl -n "$NS" get deploy,rs,svc,ingress,pod -o wide

  notify:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Discord notify (success)
        if: ${{ success() }}
        uses: rjstone/discord-webhook-notify@v1
        with:
          severity: info
          details: |
            🚀 CD succeeded
            Repo: ${{ github.repository }}
            Env: prod
            Commit: ${{ needs.deploy.outputs.sha || github.sha }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Discord notify (failure)
        if: ${{ failure() }}
        uses: rjstone/discord-webhook-notify@v1
        with:
          severity: error
          details: |
            🔴 CD failed
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
