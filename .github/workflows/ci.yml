name: CI

on:
  push:
    branches: [main, develop, test, "feature/**"]
    paths: ["frontend/**", "backend/**", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["frontend/**", "backend/**", ".github/workflows/ci.yml"]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set lowercase repo name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            fe: 'frontend/**'
      
      - name: Skip if no frontend changes
        if: steps.changes.outputs.fe != 'true'
        run: echo "No frontend changes, skipping build"
        
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.fe == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          
      - name: Build frontend
        if: steps.changes.outputs.fe == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build --if-present
          
      - uses: docker/login-action@v3
        if: steps.changes.outputs.fe == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Docker image
        if: steps.changes.outputs.fe == 'true'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}-frontend"
          docker build -t "$IMAGE:${{ github.sha }}" ./frontend
          docker push "$IMAGE:${{ github.sha }}"
          
          if [ "${{ github.ref_name }}" = "main" ]; then
            docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set lowercase repo name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            be: 'backend/**'
      
      - name: Skip if no backend changes
        if: steps.changes.outputs.be != 'true'
        run: echo "No backend changes, skipping build"
        
      - uses: actions/setup-java@v4
        if: steps.changes.outputs.be == 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          
      - name: Build backend
        if: steps.changes.outputs.be == 'true'
        working-directory: backend
        run: mvn -B package -DskipTests
        
      - uses: docker/login-action@v3
        if: steps.changes.outputs.be == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Docker image
        if: steps.changes.outputs.be == 'true'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}-backend"
          docker build -t "$IMAGE:${{ github.sha }}" ./backend
          docker push "$IMAGE:${{ github.sha }}"
          
          if [ "${{ github.ref_name }}" = "main" ]; then
            docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

  notify:
    if: always()
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        uses: rjstone/discord-webhook-notify@v1
        with:
          severity: ${{ contains(needs.*.result, 'failure') && 'error' || 'info' }}
          details: |
            ${{ contains(needs.*.result, 'failure') && '❌ CI failed' || '✅ CI succeeded' }}
            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}