name: CI

on:
  push:
    branches: [ main, develop, feature/** ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'frontend/**'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Compute lowercase repo
        id: vars
        run: echo "repo_lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- BACKEND ---
      - name: Build & push backend (main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo_lower }}-backend:latest
            ghcr.io/${{ steps.vars.outputs.repo_lower }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push backend (non-main)
        if: github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.repo_lower }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- FRONTEND ---
      - name: Build & push frontend (main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo_lower }}-frontend:latest
            ghcr.io/${{ steps.vars.outputs.repo_lower }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend (non-main)
        if: github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.repo_lower }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Notify prep (összefoglaló szöveg) ---
      - name: Prepare CI summary
        id: summary
        shell: bash
        env:
          REPO_LC: ${{ steps.vars.outputs.repo_lower }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            be="ghcr.io/${REPO_LC}-backend:latest, ghcr.io/${REPO_LC}-backend:${GITHUB_SHA}"
            fe="ghcr.io/${REPO_LC}-frontend:latest, ghcr.io/${REPO_LC}-frontend:${GITHUB_SHA}"
          else
            be="ghcr.io/${REPO_LC}-backend:${GITHUB_SHA}"
            fe="ghcr.io/${REPO_LC}-frontend:${GITHUB_SHA}"
          fi
          echo "backend_tags=$be" >> "$GITHUB_OUTPUT"
          echo "frontend_tags=$fe" >> "$GITHUB_OUTPUT"

      # --- Discord notify (success) ---
      - name: Discord notify (success)
        if: ${{ success() }}
        uses: rjstone/discord-webhook-notify@v1
        with:
          severity: info
          details: |
            ✅ **CI succeeded**
            Repo: ${{ github.repository }}
            Ref:  ${{ github.ref }}
            Commit: ${{ github.sha }}
            Backend tags:
              • ${{ steps.summary.outputs.backend_tags }}
            Frontend tags:
              • ${{ steps.summary.outputs.frontend_tags }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}

      # --- Discord notify (failure) ---
      - name: Discord notify (failure)
        if: ${{ failure() }}
        uses: rjstone/discord-webhook-notify@v1
        with:
          severity: error
          details: |
            🔴 **CI failed**
            Repo: ${{ github.repository }}
            Ref:  ${{ github.ref }}
            Commit: ${{ github.sha }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
