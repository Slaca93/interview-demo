name: CI

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase repo
        id: vars
        run: echo "repo_lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: FE | Build app
        working-directory: frontend
        run: |
          echo "::group::Frontend: npm ci & build"
          npm ci
          npm run build --if-present
          echo "::endgroup::"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: FE | Docker build & push
        run: |
          echo "::group::Frontend: docker build & push"
          IMAGE="ghcr.io/${{ steps.vars.outputs.repo_lower }}-frontend"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./frontend
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "::endgroup::"

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase repo
        id: vars
        run: echo "repo_lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: BE | Maven package (skip tests)
        working-directory: backend
        run: |
          echo "::group::Backend: mvn package (skip tests)"
          mvn -B -e -Dmaven.test.skip=true package
          echo "::endgroup::"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: BE | Docker build & push
        run: |
          echo "::group::Backend: docker build & push"
          IMAGE="ghcr.io/${{ steps.vars.outputs.repo_lower }}-backend"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./backend
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "::endgroup::"
