name: CI

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase repo
        id: vars
        run: echo "repo_lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- FRONTEND ----------
      - name: FE | Install & build (Node 20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: FE | Build app
        working-directory: frontend
        run: |
          echo "::group::Frontend: npm ci & build"
          npm ci
          npm run build --if-present
          echo "::endgroup::"

      - name: FE | Docker build
        run: |
          echo "::group::Frontend: docker build"
          IMAGE="ghcr.io/${{ steps.vars.outputs.repo_lower }}-frontend"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./frontend
          echo "IMAGE_FE=$IMAGE" >> $GITHUB_ENV
          echo "::endgroup::"

      - name: FE | Docker push
        run: |
          echo "::group::Frontend: docker push"
          docker push "$IMAGE_FE:${{ github.sha }}"
          docker push "$IMAGE_FE:latest"
          echo "::endgroup::"

      # ---------- BACKEND ----------
      - name: BE | Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: BE | Maven warmup (skip tests)
        working-directory: backend
        run: |
          echo "::group::Backend: mvn package (skip tests)"
          mvn -B -e -Dmaven.test.skip=true package
          echo "::endgroup::"

      - name: BE | Docker build
        run: |
          echo "::group::Backend: docker build"
          IMAGE="ghcr.io/${{ steps.vars.outputs.repo_lower }}-backend"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./backend
          echo "IMAGE_BE=$IMAGE" >> $GITHUB_ENV
          echo "::endgroup::"

      - name: BE | Docker push
        run: |
          echo "::group::Backend: docker push"
          docker push "$IMAGE_BE:${{ github.sha }}"
          docker push "$IMAGE_BE:latest"
          echo "::endgroup::"
