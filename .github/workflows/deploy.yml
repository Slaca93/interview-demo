name: Deploy
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to deploy"
        required: false
        default: "main"

jobs:
  deploy:
    runs-on: [ self-hosted, k8s-deployer ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Compute lowercase repo
        id: vars
        run: echo "repo_lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Apply manifests
        run: |
          # ensure namespace exists
          kubectl get ns interview-demo || kubectl create ns interview-demo
          # apply base (images majd lent felülírjuk SHA-ra)
          kustomize build k8s/overlays/prod | kubectl apply -f -

      - name: Set images to this commit's SHA
        run: |
          SHA="${GITHUB_SHA}"
          REPO="ghcr.io/${{ steps.vars.outputs.repo_lower }}"
          kubectl -n interview-demo set image deploy/frontend frontend="${REPO}-frontend:${SHA}"
          kubectl -n interview-demo set image deploy/backend  backend="${REPO}-backend:${SHA}"

      - name: Wait for rollout
        run: |
          kubectl -n interview-demo rollout status deploy/frontend --timeout=180s
          kubectl -n interview-demo rollout status deploy/backend  --timeout=180s

      - name: Show services/pods
        run: kubectl -n interview-demo get svc,pod -o wide
