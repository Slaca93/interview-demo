apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: interview-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/OWNER/REPO-backend:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /api/hello, port: 8080 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /api/hello, port: 8080 }
            initialDelaySeconds: 10
